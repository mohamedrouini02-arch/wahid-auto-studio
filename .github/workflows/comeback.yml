name: comeback
# The comeback video (films/comeback2): cut, reframe, graphics, captions, sound. Result on the "renders" branch under comeback2/.
on:
  workflow_dispatch:
    inputs:
      src: { description: "Raw clip (Drive link)", required: true, default: "https://drive.google.com/file/d/1vnZn4yKG7imXIHtwXHIwG-SQiANxhtG_/view?usp=sharing" }
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: ffmpeg (static build)
        timeout-minutes: 6
        run: |
          if curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C /tmp; then
            sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
      - run: |
          pip install -q numpy opencv-python-headless pillow rembg onnxruntime
          cd films/comeback2 && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Render
        env: { SRC: "${{ inputs.src }}" }
        run: |
          mkdir -p work/in out
          python studio/fetch_media.py "$SRC" work/in/raw.mp4
          python films/comeback2/render.py work/in/raw.mp4 out/wahid-auto-comeback.mp4 work/comeback
          ffprobe -v error -show_entries format=duration,size -of csv=p=0 out/wahid-auto-comeback.mp4
          ffmpeg -loglevel error -y -i out/wahid-auto-comeback.mp4 -vf "fps=1/3,scale=216:-1,tile=11x4" -frames:v 1 out/sheet.jpg
          for t in 1.5 3.5 13.5 33 58 66 85 104 112 124; do ffmpeg -loglevel error -y -ss $t -i out/wahid-auto-comeback.mp4 -frames:v 1 -q:v 3 out/still-$t.jpg; done
      - name: Publish to the renders branch
        run: |
          mkdir -p /tmp/pub && cp out/* /tmp/pub/
          git config user.name "wahid-auto-studio" && git config user.email "studio@wahid-auto.com"
          git stash -u -q || true
          git fetch -q origin renders || true
          if git rev-parse --verify origin/renders >/dev/null 2>&1; then git checkout -q -B renders origin/renders; else git checkout -q --orphan renders && git rm -rqf .; fi
          rm -rf comeback2 && mkdir -p comeback2 && cp /tmp/pub/* comeback2/
          git add comeback2 && git commit -qm "comeback video ${{ github.run_id }}" && git push -q origin renders
