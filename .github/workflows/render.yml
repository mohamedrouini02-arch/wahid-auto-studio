name: render
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job file under jobs/"
        required: true
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: ffmpeg (static build, avoids slow apt mirrors)
        timeout-minutes: 6
        run: |
          # static build from GitHub (reliable); apt only as a last resort
          if curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C /tmp; then
            sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
      - run: pip install -q playwright numpy pillow edge-tts && python -m playwright install --with-deps chromium
      - name: Render
        run: |
          name=$(basename "${{ inputs.job }}" .json)
          python studio/make_video.py "jobs/${{ inputs.job }}" "out/$name.mp4"
          # preview sheet so the edit can be checked without playing the video
          ffmpeg -loglevel error -y -i "out/$name.mp4" -vf "fps=1/2,scale=216:-1,tile=8x3" -frames:v 1 "out/$name-sheet.jpg"
      - uses: actions/upload-artifact@v4
        with: { name: video, path: out }
      - name: Publish to the renders branch
        run: |
          name=$(basename "${{ inputs.job }}" .json)
          mkdir -p /tmp/pub && cp out/* /tmp/pub/
          git config user.name "wahid-auto-studio" && git config user.email "studio@wahid-auto.com"
          git fetch origin renders || true
          if git rev-parse --verify origin/renders >/dev/null 2>&1; then git checkout -B renders origin/renders; else git checkout --orphan renders && git rm -rqf .; fi
          mkdir -p "$name" && cp /tmp/pub/* "$name/"
          git add "$name" && git commit -qm "render $name ${{ github.run_id }}" && git push -q origin renders
