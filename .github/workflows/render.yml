name: render
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job file under jobs/"
        required: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q playwright numpy pillow edge-tts && python -m playwright install --with-deps chromium
      - name: Render
        run: |
          name=$(basename "${{ inputs.job }}" .json)
          python studio/make_video.py "jobs/${{ inputs.job }}" "out/$name.mp4"
          # preview sheet so the edit can be checked without playing the video
          ffmpeg -loglevel error -y -i "out/$name.mp4" -vf "fps=1/2,scale=216:-1,tile=8x3" -frames:v 1 "out/$name-sheet.jpg"
      - uses: actions/upload-artifact@v4
        with: { name: video, path: out }
