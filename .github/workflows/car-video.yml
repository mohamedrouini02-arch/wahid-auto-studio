name: car-video
# Makes the TikTok video for one car, straight from the app's data.
# Started by the app (Supabase edge function -> repository_dispatch) or by hand.
on:
  repository_dispatch:
    types: [make-video]
  workflow_dispatch:
    inputs:
      car_id: { description: "car_inventory id", required: true }
permissions:
  contents: write
concurrency:
  group: car-video-${{ github.event.client_payload.car_id || inputs.car_id }}
  cancel-in-progress: true
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAR_ID: ${{ github.event.client_payload.car_id || inputs.car_id }}
      VOICE_URL: ${{ github.event.client_payload.voice_url }}
      SILENT_URL: ${{ github.event.client_payload.silent_url }}
      SUPABASE_URL: https://qtgvmqdvghvijfbacnza.supabase.co
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: studio/requirements.txt }
      - name: ffmpeg (static build)
        timeout-minutes: 6
        run: |
          # static build from GitHub (reliable); apt only as a last resort
          if curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C /tmp; then
            sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
      - name: Wahid's voice on the existing edit (fast path)
        if: env.VOICE_URL != ''
        run: |
          mkdir -p out && python studio/voice_mix.py "$SILENT_URL" "$VOICE_URL" "out/$CAR_ID-voice.mp4"
          python studio/publish.py "$CAR_ID" "out/$CAR_ID-voice.mp4" --voiced
      - name: Python tools and browser
        if: env.VOICE_URL == ''
        timeout-minutes: 8
        run: pip install -q -r studio/requirements.txt && python -m playwright install --with-deps chromium
      - name: Write the script and render
        if: env.VOICE_URL == ''
        run: |
          python studio/car_job.py "$CAR_ID" "jobs/auto/$CAR_ID.json"
          python studio/make_video.py "jobs/auto/$CAR_ID.json" "out/$CAR_ID.mp4"
          ffmpeg -loglevel error -y -i "out/$CAR_ID.mp4" -vf "fps=1/2,scale=216:-1,tile=8x3" -frames:v 1 "out/$CAR_ID-sheet.jpg"
      - name: Save the video next to the car in the app
        if: env.VOICE_URL == ''
        run: |
          MODE=$(python -c "import json;print(json.load(open('jobs/auto/$CAR_ID.json')).get('mode',''))")
          if [ "$MODE" = "talking" ]; then python studio/publish.py "$CAR_ID" "out/$CAR_ID.mp4" --voiced; else python studio/publish.py "$CAR_ID" "out/$CAR_ID.mp4"; fi
      - name: Keep a copy on the renders branch
        run: |
          mkdir -p out
          mkdir -p /tmp/pub && cp out/* /tmp/pub/ && (cp jobs/auto/$CAR_ID* /tmp/pub/ 2>/dev/null || true)
          git config user.name "wahid-auto-studio" && git config user.email "studio@wahid-auto.com"
          git fetch -q origin renders && git checkout -q -B renders origin/renders
          mkdir -p "auto/$CAR_ID" && cp /tmp/pub/* "auto/$CAR_ID/"
          git add auto && git commit -qm "video $CAR_ID ${{ github.run_id }}" && git push -q origin renders
      - name: Mark as failed
        if: failure()
        run: python studio/publish.py "$CAR_ID" --failed || true
