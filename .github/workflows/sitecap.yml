name: sitecap
# Record the website's home journey on a phone, as frames on the "sitecap" branch (used inside videos).
on:
  workflow_dispatch:
    inputs:
      ref: { description: "wahid-auto.com branch", required: true, default: light-home }
permissions:
  contents: write
jobs:
  cap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: mohamedrouini02-arch/wahid-auto.com, ref: "${{ inputs.ref }}", path: site }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd site && npm ci --no-audit --no-fund && npm run build
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: |
          cd site && (npx vite preview --port 4173 >/dev/null 2>&1 &) && sleep 4
          mkdir -p ../cap && python ../tools/sitecap.py http://localhost:4173 ../cap 240
      - run: |
          git config user.name "Wahid Auto studio" && git config user.email "studio@wahid-auto.com"
          mv cap /tmp/cap && git checkout -q --orphan sitecap && git rm -rq --cached . && rm -rf site && mkdir site && cp /tmp/cap/* site/
          git add site && git commit -qm "sitecap ${{ inputs.ref }} ${{ github.run_id }}" && git push -q -f origin HEAD:sitecap
