name: research
on:
  workflow_dispatch:
    inputs:
      files: { description: "audio files to transcribe (glob)", required: false, default: "research/audio/*.ogg" }
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: ffmpeg (static build)
        run: |
          if curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C /tmp; then
            sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
      - run: pip install -q faster-whisper
      - name: Transcribe Wahid's recordings
        run: |
          mkdir -p research/out
          for f in ${{ inputs.files || 'research/audio/*.ogg' }}; do python research/transcribe.py "$f" "research/out/$(basename "$f" .ogg).json"; done
      - name: Show transcripts in the log
        run: cat research/out/*.json
      - name: Save to the research branch
        run: |
          git config user.name "wahid-auto-studio" && git config user.email "studio@wahid-auto.com"
          # orphan branch with only the transcripts (the bot token may not push workflow files)
          mkdir -p /tmp/t && cp research/out/*.json /tmp/t/
          git checkout -q --orphan research && git rm -rqf . && cp /tmp/t/*.json . && git add *.json && git commit -qm "transcripts ${{ github.run_id }}" && git push -qf origin research
