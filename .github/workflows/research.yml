name: research
on:
  workflow_dispatch:
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: ffmpeg (static build)
        run: |
          curl -sSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar -xJ -C /tmp
          sudo cp /tmp/ffmpeg-*-static/ffmpeg /usr/local/bin/
      - run: pip install -q faster-whisper
      - name: Transcribe Wahid's recordings
        run: |
          mkdir -p research/out
          for f in research/audio/*.ogg; do python research/transcribe.py "$f" "research/out/$(basename "$f" .ogg).json"; done
      - name: Save
        run: |
          git config user.name "wahid-auto-studio" && git config user.email "studio@wahid-auto.com"
          git add research/out && git commit -qm "transcripts ${{ github.run_id }}" && git push -q origin HEAD:main
