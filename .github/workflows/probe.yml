name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in car-kit city-kit-roads city-kit-commercial watercraft-kit nature-kit; do
            echo "== $p"; curl -sL https://kenney.nl/assets/$p | grep -oE 'https?://[^"]+\.zip' | sort -u | head -3
          done
          sudo snap info blender | head -20 || true
          apt-cache policy blender | head -5
