name: refshots
# Screenshot + record a reference website while scrolling, onto the "refshots" branch.
on:
  workflow_dispatch:
    inputs:
      url: { description: "website", required: true }
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: mkdir -p ref && python tools/refshots.py "${{ inputs.url }}" ref
      - run: |
          git config user.name "Wahid Auto studio" && git config user.email "studio@wahid-auto.com"
          mv ref /tmp/ref && git checkout --orphan refshots && git rm -rq --cached . ; rm -rf ref && mv /tmp/ref ref
          git add ref && git commit -qm "refshots ${{ github.run_id }}" && git push -q -f origin HEAD:refshots
