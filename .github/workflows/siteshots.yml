name: siteshots
# Build a branch of the website and screenshot it (desktop + phone, AR + FR) onto the "shots" branch.
on:
  workflow_dispatch:
    inputs:
      ref: { description: "wahid-auto.com branch", required: true, default: master }
      pos: { description: "scroll positions in screen heights", required: true, default: "0,0.5,1.2,2,3" }
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: mohamedrouini02-arch/wahid-auto.com, ref: "${{ inputs.ref }}", path: site }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd site && npm ci --no-audit --no-fund && npm run build
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: |
          cd site && (npx vite preview --port 4173 >/dev/null 2>&1 &) && sleep 4
          mkdir -p ../shots && python ../tools/siteshots.py http://localhost:4173 ../shots "${{ inputs.pos }}"
      - run: |
          git config user.name "Wahid Auto studio" && git config user.email "studio@wahid-auto.com"
          mv shots /tmp/shots && git fetch origin shots && git checkout shots || git checkout --orphan shots
          git rm -rq --cached . 2>/dev/null || true; rm -rf shots && mv /tmp/shots shots
          git add shots && git commit -qm "shots ${{ inputs.ref }} ${{ github.run_id }}" && git push -q -f origin HEAD:shots
