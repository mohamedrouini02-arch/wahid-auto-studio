name: editor
# Jarvis, the video editor agent. Woken up by the Editor chat in the Wahid Auto app
# (Supabase function make-video -> repository_dispatch "editor" with the thread id).
# It reads the conversation, edits, and answers in the same chat.
on:
  repository_dispatch:
    types: [editor]
  workflow_dispatch:
    inputs:
      thread_id: { description: "editor_threads id", required: true }
permissions:
  contents: write
  id-token: write
concurrency:
  group: editor-${{ github.event.client_payload.thread_id || inputs.thread_id }}
  cancel-in-progress: false
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      THREAD: ${{ github.event.client_payload.thread_id || inputs.thread_id }}
      SUPABASE_URL: https://qtgvmqdvghvijfbacnza.supabase.co
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: studio/requirements.txt }
      - name: Make sure the agent has a key
        env: { A: "${{ secrets.ANTHROPIC_API_KEY }}", B: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" }
        run: |
          # tokens copied from a terminal often carry line breaks/spaces: strip all whitespace
          A=$(printf '%s' "$A" | tr -d '[:space:]'); B=$(printf '%s' "$B" | tr -d '[:space:]')
          echo "::add-mask::$A"; echo "::add-mask::$B"
          echo "CLEAN_API_KEY=$A" >> "$GITHUB_ENV"; echo "CLEAN_OAUTH=$B" >> "$GITHUB_ENV"
          # shape check (prints only the public prefix and the length, never the token)
          echo "oauth token: prefix ${B:0:13}… length ${#B}"; echo "api key: prefix ${A:0:11}… length ${#A}"
          bad=""
          if [ -n "$B" ] && [[ "$B" != sk-ant-oat* ]]; then bad="CLAUDE_CODE_OAUTH_TOKEN does not start with sk-ant-oat (it starts with ${B:0:7}…). It must be the line printed by 'claude setup-token'."; fi
          if [ -n "$A" ] && [[ "$A" != sk-ant-api* ]]; then bad="ANTHROPIC_API_KEY does not start with sk-ant-api (it starts with ${A:0:7}…)."; fi
          if [ -z "$A$B" ]; then bad="the Claude key is missing. Add CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY) in GitHub → wahid-auto-studio → Settings → Secrets → Actions."; fi
          if [ -n "$bad" ]; then
            python studio/thread.py say "$THREAD" "⚠️ I can't start yet: $bad"
            python studio/thread.py status "$THREAD" idle; touch /tmp/nokey; exit 1
          fi
      - name: ffmpeg (static build)
        timeout-minutes: 6
        run: |
          if curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C /tmp; then
            sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
      - name: Python tools and browser
        timeout-minutes: 15
        run: |
          pip install -q -r studio/requirements.txt && python -m playwright install --with-deps chromium
          mkdir -p out work/in jobs/agent agent
          git config user.name "Jarvis (Wahid Auto editor)" && git config user.email "studio@wahid-auto.com"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ env.CLEAN_OAUTH }}
          anthropic_api_key: ${{ env.CLEAN_API_KEY }}
          github_token: ${{ github.token }}
          show_full_output: true
          prompt: |
            You are Jarvis, the Wahid Auto video editor. Follow CLAUDE.md in this repo (read it first, and agent/notes.md).
            Mohamed is talking to you in the Editor chat of the Wahid Auto app. Conversation id: ${{ env.THREAD }}
            Read it:   python studio/thread.py show ${{ env.THREAD }}
            Answer:    python studio/thread.py say ${{ env.THREAD }} "text" [--video URL]   (or --file reply.txt for longer text)
            His newest message(s) at the end are what to do now; earlier messages are the history of this job.
            Do the work, answer in the chat, then commit the job file (and notes if any) to main:
            git add jobs/agent agent && git commit -m "..." && git pull --rebase && git push
          claude_args: >-
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch"
            --max-turns 120
      - name: Done (or say it crashed)
        if: always()
        run: |
          if [ "${{ job.status }}" != "success" ] && [ ! -f /tmp/nokey ]; then
            if grep -qs authentication_failed /home/runner/work/_temp/claude-execution-output.json; then
              python studio/thread.py say "$THREAD" "⚠️ Claude refused the key (authentication failed). The token in GitHub is expired or wrong: run 'claude setup-token' again and replace CLAUDE_CODE_OAUTH_TOKEN." || true
            else
              python studio/thread.py say "$THREAD" "⚠️ I stopped with an error before finishing. Send your message again to retry." || true
            fi
          fi
          python studio/thread.py status "$THREAD" idle || true
