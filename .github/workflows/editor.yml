name: editor
# Jarvis, the video editor agent. Open an issue in this repo with the footage + notes
# (or comment on an open one) and it edits, renders and answers with the video.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
  id-token: write
concurrency:
  group: editor-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  edit:
    # only Mohamed's own words start a job (the agent's replies come from the bot and never loop)
    if: >-
      !github.event.issue.pull_request &&
      (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner ||
       github.event_name == 'issue_comment' && github.event.comment.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: https://qtgvmqdvghvijfbacnza.supabase.co
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: studio/requirements.txt }
      - name: Tell him it started
        run: gh issue comment ${{ github.event.issue.number }} --body "👀 Jarvis is on it…" || true
      - name: ffmpeg (static build)
        timeout-minutes: 6
        run: |
          if curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C /tmp; then
            sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
      - name: Python tools and browser
        timeout-minutes: 15
        run: |
          pip install -q -r studio/requirements.txt && python -m playwright install --with-deps chromium
          mkdir -p out work/in jobs/agent agent
          git config user.name "Jarvis (Wahid Auto editor)" && git config user.email "studio@wahid-auto.com"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            You are Jarvis, the Wahid Auto video editor. Follow CLAUDE.md in this repo (read it first, and agent/notes.md).
            Repository: ${{ github.repository }}. Job = issue #${{ github.event.issue.number }}.
            ${{ github.event_name == 'issue_comment' && 'He just added a new comment on this issue: treat it as notes/changes on the current job.' || 'This is a new job.' }}
            Read the whole conversation with: gh issue view ${{ github.event.issue.number }} --comments
            Do the work, then answer him ONLY by posting comments with: gh issue comment ${{ github.event.issue.number }} --body-file <file>
            Commit the job file (and notes if any) to main: git add jobs/agent agent && git commit -m "..." && git pull --rebase && git push
          claude_args: >-
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch"
            --max-turns 120
      - name: If it crashed, say so
        if: failure()
        run: gh issue comment ${{ github.event.issue.number }} --body "⚠️ The editor stopped with an error. Open the Actions tab for details, or just comment again to retry." || true
